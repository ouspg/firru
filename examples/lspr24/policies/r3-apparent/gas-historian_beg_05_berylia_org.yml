metadata:
  host: gas-historian
  zone: beg
  provenance: "flows_to_enforced.py \u2014 INFERRED, not a recovered configuration"
filters:
- header:
    targets:
      nftables: mixed input DROP
  terms:
  - name: allow-tcp-SSH
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address: ANY
    comment: 3 sources answered, 1 not
  - name: allow-tcp-MYSQL
    protocol: tcp
    destination-port: MYSQL
    action: accept
    source-address: ANY
    comment: 3 sources answered, 1 not
  - name: allow-tcp-HTTP-ALT
    protocol: tcp
    destination-port: HTTP-ALT
    action: accept
    source-address: ANY
    comment: 4 sources answered, 2 not
  - name: drop-ANY
    action: deny
