      - name: allow-tcp-SSH
        protocol: tcp
        destination-port: SSH
        action: accept
        source-address:
          - BAF_INT_GT
# [auto] IPv4 0.0.0.0/0 (MSExchangeFrontendTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\MSExchangeFrontendTransport.exe MSExchangeFrontEndTransport) | IPv6 ::/0 (MSExchangeFrontendTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\MSExchangeFrontendTransport.exe MSExchangeFrontEndTransport)
      - name: allow-tcp-SMTP
        protocol: tcp
        destination-port: SMTP
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System) | aliases: HTTP,WINDOWS-HYPERV-REPLICA-HTTP
      - name: allow-tcp-HTTP
        protocol: tcp
        destination-port: HTTP
