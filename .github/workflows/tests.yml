# The test suite, on every push and pull request, on the oldest and a recent
# Python firru supports, from a regular install of the dependencies (the
# Aerleon fork comes from git).
#
# A second job rebuilds the fleet examples from the runs in examples/baselines/
# and compares them with examples/*/expected/ (examples/check.sh).

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install '.[test]'
      - name: Test
        run: pytest -q

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install .
      - name: Rebuild the examples
        run: examples/check.sh
