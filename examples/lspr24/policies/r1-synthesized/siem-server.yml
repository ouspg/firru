metadata:
  host: siem-server
  zone: core
filters:
  - header:
      targets:
        nftables: mixed input DROP
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
# [auto] IPv4 0.0.0.0/0 | IPv6 ::/0
# [auto] unexpected owner: SSH no process attribution; expected sshd, dropbear, ssh.socket, sshd.socket, ssh.service, sshd.service
      - name: allow-tcp-SSH
        protocol: tcp
        destination-port: SSH
        action: accept
        source-address:
          - MGMT_HOSTS
# [auto] IPv4 0.0.0.0/0 (wazuh-remoted)
      - name: allow-tcp-SYSLOG
        protocol: tcp
        destination-port: SYSLOG
        action: accept
        source-address: ANY_V4
# [auto] IPv4 0.0.0.0/0 (wazuh-remoted)
      - name: allow-tcp-TCP_1514
        protocol: tcp
        destination-port: TCP_1514
        action: accept
        source-address: ANY_V4
# [auto] IPv4 0.0.0.0/0 (wazuh-authd)
      - name: allow-tcp-TCP_1515
        protocol: tcp
        destination-port: TCP_1515
        action: accept
        source-address: ANY_V4
# [auto] IPv4 0.0.0.0/0 (wazuh-remoted)
      - name: allow-udp-SYSLOG
        protocol: udp
        destination-port: SYSLOG
        action: accept
        source-address: ANY_V4
      - name: drop-ANY
        action: deny
        counter: drop-ANY

# egress
  - header:
      targets:
        nftables: mixed output
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
      - name: allow-ANY
        action: accept
