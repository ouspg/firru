metadata:
  host: baf_int
  zone: baf_int
  hosts:
  - mail_int_baf_05_berylia_org
  - ticketdesk_int_baf_05_berylia_org
  - ws1-baf01_int_baf_05_berylia_org
  - ws3-baf05_int_baf_05_berylia_org
filters:
- header:
    targets:
      nftables: mixed input
  terms:
  - name: allow-tcp-SSH-shared
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address: ANY
    comment: every one of 3 sources was answered
    destination-address: mail_int_baf_05_berylia_org ticketdesk_int_baf_05_berylia_org
      ws1-baf01_int_baf_05_berylia_org ws3-baf05_int_baf_05_berylia_org
  - name: mail_int_baf_05_berylia_org-allow-tcp-SMTP
    protocol: tcp
    destination-port: SMTP
    action: accept
    source-address: ANY
    comment: every one of 4 sources was answered
    destination-address: mail_int_baf_05_berylia_org
  - name: allow-tcp-HTTP-shared
    protocol: tcp
    destination-port: HTTP
    action: accept
    source-address: ANY
    comment: every one of 2 sources was answered
    destination-address: mail_int_baf_05_berylia_org ticketdesk_int_baf_05_berylia_org
  - name: allow-tcp-HTTPS-shared
    protocol: tcp
    destination-port: HTTPS
    action: accept
    source-address: ANY
    comment: every one of 7 sources was answered
    destination-address: mail_int_baf_05_berylia_org ticketdesk_int_baf_05_berylia_org
  - name: mail_int_baf_05_berylia_org-allow-tcp-SMTPS
    protocol: tcp
    destination-port: SMTPS
    action: accept
    source-address: ANY
    comment: every one of 2 sources was answered
    destination-address: mail_int_baf_05_berylia_org
  - name: mail_int_baf_05_berylia_org-allow-tcp-SMTP-SUBMIT
    protocol: tcp
    destination-port: SMTP-SUBMIT
    action: accept
    source-address: ANY
    comment: every one of 2 sources was answered
    destination-address: mail_int_baf_05_berylia_org
  - name: mail_int_baf_05_berylia_org-allow-udp-NTP
    protocol: udp
    destination-port: NTP
    action: accept
    source-address: ANY
    comment: every one of 1 sources was answered
    destination-address: mail_int_baf_05_berylia_org
  - name: drop-ghost-hosts
    action: deny
    destination-address: baf_int
    comment: 'Ghost host catch-all: drops traffic to IPs in baf_int not matched by
      any allow term above.  All legitimate hosts should appear in policies/pol/ and
      be covered by explicit allow terms.'
  - name: log-accept-ANY
    action: accept
    logging: true
    comment: 'INITIAL DEPLOYMENT: accept + log all unmatched traffic. Promote to log-drop
      (--terminal log-drop) once rules are stable.'
