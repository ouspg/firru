metadata:
  host: cctv-ai-monitor
  zone: bgp_int
  variant: 'r4-block-early (learn file: night.jsonl) — services with no observed client
    are removed, not merely narrowed'
filters:
- header:
    targets:
      nftables: mixed input DROP
  terms:

# [auto] 1799 flows total | 1799 hits: BGP_INT_GT_OTHER (10.5.13.250, 2a07:1182:5:13::250) | via: SSH/tcp/22
  - name: allow-tcp-SSH
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address: BGP_INT_GT_OTHER      # was: BGP_INT_GT

# [auto] no flows observed in window — source unchanged
  - name: allow-loopback
    source-address: LOOPBACK
    action: accept

# [auto] no flows observed in window — source unchanged
  - name: allow-icmp
    protocol: icmp
    action: accept

# [auto] no flows observed in window — source unchanged
  - name: allow-icmpv6
    protocol: icmpv6
    action: accept

# [auto] no flows observed in window — source unchanged
  - name: drop-ANY
    action: deny
    counter: drop-ANY

- header:
    targets:
      nftables: mixed output
  terms:
  - name: allow-loopback
    action: accept
    source-address: LOOPBACK
  - name: allow-icmp
    action: accept
    protocol: icmp
  - name: allow-icmpv6
    action: accept
    protocol: icmpv6
# [auto] 337 hits: bgp_int (2a07:1182:5:13::1) | 113 hits: core (fe80::250:56ff:fe89:cef1) | 51 hits: BGP_INT_GT_OTHER (2a07:1182:5:13::250)
  - name: allow-icmpv6-ICMPV6
