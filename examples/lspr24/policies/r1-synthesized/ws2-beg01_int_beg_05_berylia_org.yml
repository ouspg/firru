metadata:
  host: ws2-beg01
  zone: beg_int_12
filters:
  - header:
      targets:
        windows_advfirewall: in mixed block
    terms:
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
# [auto] IPv4 0.0.0.0/0 (sshd C:\Program Files\OpenSSH\sshd.exe sshd) | IPv6 ::/0 (sshd C:\Program Files\OpenSSH\sshd.exe sshd)
      - name: allow-tcp-SSH
        protocol: tcp
        destination-port: SSH
        action: accept
        source-address:
          - BEG_INT_12_GT
          - BEG_INT_12_MGMT
          - MGMT_HOSTS
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe RpcEptMapper RpcSs) | IPv6 ::/0 (svchost C:\WINDOWS\system32\svchost.exe RpcEptMapper RpcSs)
      - name: allow-tcp-WINDOWS-RPC-ENDPOINT-MAPPER
        protocol: tcp
        destination-port: WINDOWS-RPC-ENDPOINT-MAPPER
        action: accept
        source-address: ANY
# [auto] IPv4 10.5.12.26/32 (System)
      - name: allow-tcp-NETBIOS-SSN-LEGACY
        protocol: tcp
        destination-port: NETBIOS-SSN-LEGACY
        action: accept
        source-address:
          - BEG_INT_12_HOSTS
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System)
      - name: allow-tcp-WINDOWS-SMB
        protocol: tcp
        destination-port: WINDOWS-SMB
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\System32\svchost.exe TermService) | IPv6 ::/0 (svchost C:\WINDOWS\System32\svchost.exe TermService)
      - name: allow-tcp-RDP
        protocol: tcp
        destination-port: RDP
        action: accept
        source-address:
          - BEG_INT_12_GT
          - BEG_INT_12_MGMT
          - MGMT_HOSTS
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe CDPSvc)
      - name: allow-tcp-WINDOWS-CDP
        protocol: tcp
        destination-port: WINDOWS-CDP
        action: accept
        source-address:
          - BEG_INT_12_HOSTS
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System)
      - name: allow-tcp-WINRM-HTTP
        protocol: tcp
        destination-port: WINRM-HTTP
        action: accept
        source-address:
          - BEG_INT_12_GT
          - BEG_INT_12_MGMT
          - MGMT_HOSTS
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System)
      - name: allow-tcp-WINDOWS-WINRM-UNCONFIGURED
        protocol: tcp
        destination-port: WINDOWS-WINRM-UNCONFIGURED
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe W32Time) | IPv6 ::/0 (svchost C:\WINDOWS\system32\svchost.exe W32Time)
      - name: allow-udp-NTP
        protocol: udp
        destination-port: NTP
        action: accept
        source-address: ANY
# [auto] IPv4 10.5.12.26/32 (System)
      - name: allow-udp-NETBIOS-NS-LEGACY
        protocol: udp
        destination-port: NETBIOS-NS-LEGACY
        action: accept
        source-address:
          - BEG_INT_12_HOSTS
# [auto] IPv4 10.5.12.26/32 (System)
      - name: allow-udp-NETBIOS-DGM-LEGACY
        protocol: udp
        destination-port: NETBIOS-DGM-LEGACY
        action: accept
        source-address:
          - BEG_INT_12_HOSTS
# [auto] IPv4 10.5.12.26/32 (svchost C:\WINDOWS\system32\svchost.exe SSDPSRV) | IPv6 2a07:1182:5:12::26/128 (svchost C:\WINDOWS\system32\svchost.exe SSDPSRV)
      - name: deny-udp-SSDP
        protocol: udp
        destination-port: SSDP
        action: deny
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\System32\svchost.exe TermService) | IPv6 ::/0 (svchost C:\WINDOWS\System32\svchost.exe TermService)
      - name: allow-udp-RDP
        protocol: udp
        destination-port: RDP
        action: accept
        source-address:
          - BEG_INT_12_GT
          - BEG_INT_12_MGMT
          - MGMT_HOSTS
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe CDPSvc)
      - name: allow-udp-WINDOWS-CDP
        protocol: udp
        destination-port: WINDOWS-CDP
        action: accept
        source-address:
          - BEG_INT_12_HOSTS
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe Dnscache) | IPv6 ::/0 (svchost C:\WINDOWS\system32\svchost.exe Dnscache)
      - name: allow-udp-MDNS
        protocol: udp
        destination-port: MDNS
        action: accept
        source-address:
          - MDNS_SOURCES_V4
          - MDNS_SOURCES_V6
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe Dnscache) | IPv6 ::/0 (svchost C:\WINDOWS\system32\svchost.exe Dnscache)
      - name: allow-udp-LLMNR
        protocol: udp
        destination-port: LLMNR
        action: accept
        source-address:
          - LLMNR_SOURCES_V4
          - LLMNR_SOURCES_V6
      - name: drop-ANY
        action: deny
        platform-exclude:
          - windows_advfirewall

# egress
  - header:
      targets:
        windows_advfirewall: out mixed
    terms:
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
      - name: allow-ANY
        action: accept
