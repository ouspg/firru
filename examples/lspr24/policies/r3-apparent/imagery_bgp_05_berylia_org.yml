metadata:
  host: imagery
  zone: bgp
  provenance: "flows_to_enforced.py \u2014 INFERRED, not a recovered configuration"
filters:
- header:
    targets:
      nftables: mixed input DROP
  terms:
  - name: allow-tcp-SSH
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address: ANY
    comment: every one of 7 sources was answered
  - name: allow-tcp-HTTP
    protocol: tcp
    destination-port: HTTP
    action: accept
    source-address: ANY
    comment: every one of 7 sources was answered
  - name: allow-tcp-HTTPS
    protocol: tcp
    destination-port: HTTPS
    action: accept
    source-address: ANY
    comment: 57 sources answered, 2 not
  - name: drop-ANY
    action: deny
