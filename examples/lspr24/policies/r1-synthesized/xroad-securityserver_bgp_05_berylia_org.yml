metadata:
  host: xroad-securityserver
  zone: bgp
filters:
  - header:
      targets:
        nftables: mixed input DROP
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
# [auto] IPv4 0.0.0.0/0 | IPv6 ::/0
# [auto] unexpected owner: SSH no process attribution; expected sshd, dropbear, ssh.socket, sshd.socket, ssh.service, sshd.service
      - name: allow-tcp-SSH
        protocol: tcp
        destination-port: SSH
        action: accept
        source-address:
          - BGP_GT
# [auto] IPv6 ::/0 (java) | aliases: HTTP,WINDOWS-HYPERV-REPLICA-HTTP
# [auto] unexpected owner: HTTP served by java (a language runtime, not a named server); expected nginx, apache2, httpd, caddy, haproxy, traefik, +5 more
      - name: allow-tcp-HTTP
        protocol: tcp
        destination-port: HTTP
        action: accept
        source-address: ANY_V6
# [auto] IPv6 ::/0 (java) | aliases: HTTPS,WINDOWS-HYPERV-REPLICA-HTTPS
# [auto] unexpected owner: HTTPS served by java (a language runtime, not a named server); expected nginx, apache2, httpd, caddy, haproxy, traefik, +5 more
      - name: allow-tcp-HTTPS
        protocol: tcp
        destination-port: HTTPS
        action: accept
        source-address: ANY_V6
# [auto] IPv6 ::/0 (java)
      - name: allow-tcp-TCP_4000
        protocol: tcp
        destination-port: TCP_4000
        action: accept
        source-address: ANY_V6
# [auto] IPv6 ::/0 (java)
      - name: allow-tcp-TCP_5500
        protocol: tcp
        destination-port: TCP_5500
        action: accept
        source-address: ANY_V6
# [auto] IPv6 ::/0 (java)
      - name: allow-tcp-TCP_5577
        protocol: tcp
        destination-port: TCP_5577
        action: accept
        source-address: ANY_V6
# [auto] IPv6 ::/0 (java)
      - name: allow-tcp-TCP_5588
        protocol: tcp
        destination-port: TCP_5588
        action: accept
        source-address: ANY_V6
      - name: drop-ANY
        action: deny
        counter: drop-ANY

# egress
  - header:
      targets:
        nftables: mixed output
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
      - name: allow-ANY
        action: accept
