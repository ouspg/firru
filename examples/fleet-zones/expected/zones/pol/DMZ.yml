metadata:
  host: DMZ
  zone: DMZ
  hosts:
  - mail1
  - ns1
  - web1
filters:
- header:
    targets:
      nftables: mixed input
  terms:
  - name: allow-icmp-any-shared
    protocol: icmp
    action: accept
    destination-address: DMZ_HOSTS
  - name: allow-icmpv6-any-shared
    protocol: icmpv6
    action: accept
    destination-address: DMZ_HOSTS
  - name: allow-tcp-SSH-shared
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address:
    - jump1
    destination-address: DMZ_HOSTS
  - name: mail1-allow-tcp-SMTP
    protocol: tcp
    destination-port: SMTP
    action: accept
    source-address: ANY
    destination-address: mail1
  - name: mail1-allow-tcp-POP3
    protocol: tcp
    destination-port: POP3
    action: accept
    source-address: ANY
    destination-address: mail1
  - name: mail1-allow-tcp-IMAP
    protocol: tcp
    destination-port: IMAP
    action: accept
    source-address: ANY
    destination-address: mail1
  - name: mail1-allow-tcp-IMAPS
    protocol: tcp
    destination-port: IMAPS
    action: accept
    source-address: ANY
    destination-address: mail1
  - name: mail1-allow-tcp-POP3S
    protocol: tcp
    destination-port: POP3S
    action: accept
    source-address: ANY
    destination-address: mail1
  - name: allow-udp-DHCP-CLIENT-shared
    protocol: udp
    destination-port: DHCP-CLIENT
    action: accept
    source-address: ANY_V4
    destination-address: mail1 web1
  - name: ns1-allow-tcp-DNS-TCP
    protocol: tcp
    destination-port: DNS-TCP
    action: accept
    source-address: ANY
    destination-address: ns1
  - name: ns1-allow-udp-DNS-UDP
    protocol: udp
    destination-port: DNS-UDP
    action: accept
    source-address: ANY
    destination-address: ns1
  - name: web1-allow-tcp-HTTP
    protocol: tcp
    destination-port: HTTP
    action: accept
    source-address: ANY
    destination-address: web1
  - name: web1-allow-tcp-HTTPS
    protocol: tcp
    destination-port: HTTPS
    action: accept
    source-address: ANY
    destination-address: web1
  - name: drop-ghost-hosts
    action: deny
    destination-address: DMZ
    comment: 'Ghost host catch-all: drops traffic to IPs in DMZ not matched by any
      allow term above.  All legitimate hosts should appear in policies/pol/ and be
      covered by explicit allow terms.'
  - name: log-drop-ANY
    action: deny
    logging: true
    comment: 'SETTLING: drop + log unmatched traffic to catch false positives. Promote
      to drop (--terminal drop) when the log has been quiet.'
