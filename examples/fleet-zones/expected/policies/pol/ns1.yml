metadata:
  host: ns1
  zone: DMZ
filters:
  - header:
      targets:
        nftables: mixed input DROP
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
# [auto] IPv4 0.0.0.0/0 (sshd) | IPv6 ::/0 (sshd)
      - name: allow-tcp-SSH
        protocol: tcp
        destination-port: SSH
        action: accept
        source-address:
          - jump1
# [auto] IPv4 0.0.0.0/0 (named /usr/sbin/named) | IPv6 ::/0 (named /usr/sbin/named)
      - name: allow-tcp-DNS-TCP
        protocol: tcp
        destination-port: DNS-TCP
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (named /usr/sbin/named) | IPv6 ::/0 (named /usr/sbin/named)
      - name: allow-udp-DNS-UDP
        protocol: udp
        destination-port: DNS-UDP
        action: accept
        source-address: ANY
      - name: drop-ANY
        action: deny
        counter: drop-ANY

# egress
  - header:
      targets:
        nftables: mixed output
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
      - name: allow-ANY
        action: accept
