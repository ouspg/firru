      (1871 hits) -- a single destination: name it or deny it, ANY is not the answer
      either way'
    action: accept
    source-address: mail_int_baf_05_berylia_org ticketdesk_int_baf_05_berylia_org
      ws1-baf01_int_baf_05_berylia_org ws3-baf05_int_baf_05_berylia_org
