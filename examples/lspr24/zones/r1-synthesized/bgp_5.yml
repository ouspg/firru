metadata:
  host: bgp_5
  zone: bgp_5
  hosts:
  - alert-system_bgp_05_berylia_org
  - entry_bgp_05_berylia_org
  - imagery_bgp_05_berylia_org
  - keycloak_bgp_05_berylia_org
  - lims_bgp_05_berylia_org
  - nextcloud_bgp_05_berylia_org
  - ns1_bgp_05_berylia_org
  - ns2_bgp_05_berylia_org
  - visitor_bgp_05_berylia_org
  - whistleblowhub_bgp_05_berylia_org
  - www_bgp_05_berylia_org
  - xroad-securityserver_bgp_05_berylia_org
filters:
- header:
    targets:
      nftables: mixed input
  terms:
  - name: allow-icmp-any-shared
    protocol: icmp
    action: accept
    destination-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org
      imagery_bgp_05_berylia_org keycloak_bgp_05_berylia_org lims_bgp_05_berylia_org
      nextcloud_bgp_05_berylia_org ns1_bgp_05_berylia_org ns2_bgp_05_berylia_org visitor_bgp_05_berylia_org
      whistleblowhub_bgp_05_berylia_org www_bgp_05_berylia_org xroad-securityserver_bgp_05_berylia_org
  - name: allow-icmpv6-any-shared
    protocol: icmpv6
    action: accept
    destination-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org
      imagery_bgp_05_berylia_org keycloak_bgp_05_berylia_org lims_bgp_05_berylia_org
      nextcloud_bgp_05_berylia_org ns1_bgp_05_berylia_org ns2_bgp_05_berylia_org visitor_bgp_05_berylia_org
      whistleblowhub_bgp_05_berylia_org www_bgp_05_berylia_org xroad-securityserver_bgp_05_berylia_org
  - name: allow-tcp-SSH-shared
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address:
    - BGP_5_GT
    - MGMT_HOSTS
    destination-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org
      imagery_bgp_05_berylia_org keycloak_bgp_05_berylia_org lims_bgp_05_berylia_org
      nextcloud_bgp_05_berylia_org ns1_bgp_05_berylia_org ns2_bgp_05_berylia_org visitor_bgp_05_berylia_org
      whistleblowhub_bgp_05_berylia_org www_bgp_05_berylia_org xroad-securityserver_bgp_05_berylia_org
  - name: allow-tcp-HTTP-shared
    protocol: tcp
    destination-port: HTTP
    action: accept
    source-address: ANY
    destination-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org
      imagery_bgp_05_berylia_org lims_bgp_05_berylia_org nextcloud_bgp_05_berylia_org
      visitor_bgp_05_berylia_org whistleblowhub_bgp_05_berylia_org www_bgp_05_berylia_org
      xroad-securityserver_bgp_05_berylia_org
  - name: allow-tcp-HTTPS-shared
    protocol: tcp
    destination-port: HTTPS
    action: accept
    source-address: ANY
    destination-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org
      imagery_bgp_05_berylia_org keycloak_bgp_05_berylia_org lims_bgp_05_berylia_org
      nextcloud_bgp_05_berylia_org visitor_bgp_05_berylia_org whistleblowhub_bgp_05_berylia_org
      www_bgp_05_berylia_org xroad-securityserver_bgp_05_berylia_org
  - name: alert-system_bgp_05_berylia_org-allow-tcp-TCP_5001
    protocol: tcp
    destination-port: TCP_5001
    action: accept
    source-address: ANY
    destination-address: alert-system_bgp_05_berylia_org
  - name: alert-system_bgp_05_berylia_org-allow-tcp-TCP_5002
    protocol: tcp
    destination-port: TCP_5002
    action: accept
    source-address: ANY
    destination-address: alert-system_bgp_05_berylia_org
  - name: alert-system_bgp_05_berylia_org-allow-tcp-REDIS
    protocol: tcp
    destination-port: REDIS
    action: accept
    source-address: ANY
    destination-address: alert-system_bgp_05_berylia_org
  - name: entry_bgp_05_berylia_org-allow-tcp-MYSQL
    protocol: tcp
    destination-port: MYSQL
    action: accept
    source-address: ANY_V4
    destination-address: entry_bgp_05_berylia_org
  - name: imagery_bgp_05_berylia_org-allow-tcp-TCP_18336
    protocol: tcp
    destination-port: TCP_18336
    action: accept
    source-address: ANY
    destination-address: imagery_bgp_05_berylia_org
  - name: keycloak_bgp_05_berylia_org-allow-tcp-TCP_22395
    protocol: tcp
    destination-port: TCP_22395
    action: accept
    source-address: ANY
    destination-address: keycloak_bgp_05_berylia_org
  - name: keycloak_bgp_05_berylia_org-allow-udp-KEYCLOAK-PING
    protocol: udp
    destination-port: KEYCLOAK-PING
    action: accept
    source-address: ANY_V4
    destination-address: keycloak_bgp_05_berylia_org
  - name: lims_bgp_05_berylia_org-allow-tcp-HTTP-ALT
    protocol: tcp
    destination-port: HTTP-ALT
    action: accept
    source-address: ANY_V4
    destination-address: lims_bgp_05_berylia_org
  - name: lims_bgp_05_berylia_org-allow-tcp-TCP_8888
    protocol: tcp
    destination-port: TCP_8888
    action: accept
    source-address: ANY
    destination-address: lims_bgp_05_berylia_org
  - name: allow-tcp-DNS-TCP-shared
    protocol: tcp
    destination-port: DNS-TCP
    action: accept
    source-address: ANY
    destination-address: ns1_bgp_05_berylia_org ns2_bgp_05_berylia_org
  - name: allow-tcp-TCP_5353-shared
    protocol: tcp
    destination-port: TCP_5353
    action: accept
    source-address: ANY
    destination-address: ns1_bgp_05_berylia_org ns2_bgp_05_berylia_org
  - name: allow-udp-DNS-UDP-shared
    protocol: udp
    destination-port: DNS-UDP
    action: accept
    source-address: ANY
    destination-address: ns1_bgp_05_berylia_org ns2_bgp_05_berylia_org
  - name: visitor_bgp_05_berylia_org-allow-tcp-TCP_5000
    protocol: tcp
    destination-port: TCP_5000
    action: accept
    source-address: ANY
    destination-address: visitor_bgp_05_berylia_org
  - name: www_bgp_05_berylia_org-allow-tcp-FTP-CONTROL
    protocol: tcp
    destination-port: FTP-CONTROL
    action: accept
    source-address: ANY_V4
    destination-address: www_bgp_05_berylia_org
  - name: xroad-securityserver_bgp_05_berylia_org-allow-tcp-TCP_4000
    protocol: tcp
    destination-port: TCP_4000
    action: accept
    source-address: ANY
    destination-address: xroad-securityserver_bgp_05_berylia_org
  - name: xroad-securityserver_bgp_05_berylia_org-allow-tcp-TCP_5500
    protocol: tcp
    destination-port: TCP_5500
    action: accept
    source-address: ANY
    destination-address: xroad-securityserver_bgp_05_berylia_org
  - name: xroad-securityserver_bgp_05_berylia_org-allow-tcp-TCP_5577
    protocol: tcp
    destination-port: TCP_5577
    action: accept
    source-address: ANY
    destination-address: xroad-securityserver_bgp_05_berylia_org
  - name: xroad-securityserver_bgp_05_berylia_org-allow-tcp-TCP_5588
    protocol: tcp
    destination-port: TCP_5588
    action: accept
    source-address: ANY
    destination-address: xroad-securityserver_bgp_05_berylia_org
  - name: drop-ghost-hosts
    action: deny
    destination-address: bgp_5
    comment: 'Ghost host catch-all: drops traffic to IPs in bgp_5 not matched by any
      allow term above.  All legitimate hosts should appear in policies/pol/ and be
      covered by explicit allow terms.'
  - name: log-accept-ANY
    action: accept
    logging: true
    comment: 'INITIAL DEPLOYMENT: accept + log all unmatched traffic. Promote to log-drop
      (--terminal log-drop) once rules are stable.'
