filters:
- header:
    targets:
      nftables: mixed input DROP
  terms:

# [auto] no flows observed in window — source unchanged
  - name: allow-loopback
    source-address: LOOPBACK
    action: accept

# [auto] no flows observed in window — source unchanged
  - name: allow-icmp
    protocol: icmp
    action: accept

# [auto] no flows observed in window — source unchanged
  - name: allow-icmpv6
