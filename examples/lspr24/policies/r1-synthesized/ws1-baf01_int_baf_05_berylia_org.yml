metadata:
  host: ws1-baf01
  zone: baf_int
filters:
  - header:
      targets:
        windows_advfirewall: in mixed block
    terms:
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
# [auto] IPv4 0.0.0.0/0 (sshd C:\Program Files\OpenSSH\sshd.exe sshd) | IPv6 ::/0 (sshd C:\Program Files\OpenSSH\sshd.exe sshd)
      - name: allow-tcp-SSH
        protocol: tcp
        destination-port: SSH
        action: accept
        source-address:
          - BAF_INT_GT
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe RpcEptMapper RpcSs) | IPv6 ::/0 (svchost C:\WINDOWS\system32\svchost.exe RpcEptMapper RpcSs)
      - name: allow-tcp-WINDOWS-RPC-ENDPOINT-MAPPER
        protocol: tcp
        destination-port: WINDOWS-RPC-ENDPOINT-MAPPER
        action: accept
        source-address: ANY
# [auto] IPv4 192.168.150.174/32 (System)
      - name: allow-tcp-NETBIOS-SSN-LEGACY
        protocol: tcp
        destination-port: NETBIOS-SSN-LEGACY
        action: accept
        source-address:
          - BAF_INT_HOSTS
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System)
      - name: allow-tcp-WINDOWS-SMB
        protocol: tcp
        destination-port: WINDOWS-SMB
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (svchost.exe) | IPv6 ::/0 (svchost.exe)
      - name: allow-tcp-RDP
        protocol: tcp
        destination-port: RDP
        action: accept
        source-address:
          - BAF_INT_GT
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe CDPSvc)
      - name: allow-tcp-TCP_5040
        protocol: tcp
        destination-port: TCP_5040
        action: accept
        source-address: ANY_V4
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System)
      - name: allow-tcp-WINRM-HTTP
        protocol: tcp
        destination-port: WINRM-HTTP
        action: accept
        source-address:
          - BAF_INT_GT
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System)
      - name: allow-tcp-WINDOWS-WINRM-UNCONFIGURED
        protocol: tcp
        destination-port: WINDOWS-WINRM-UNCONFIGURED
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe W32Time) | IPv6 ::/0 (svchost C:\WINDOWS\system32\svchost.exe W32Time)
      - name: allow-udp-NTP
        protocol: udp
        destination-port: NTP
        action: accept
        source-address: ANY
# [auto] IPv4 192.168.150.174/32 (System)
      - name: allow-udp-NETBIOS-NS-LEGACY
        protocol: udp
        destination-port: NETBIOS-NS-LEGACY
        action: accept
        source-address:
          - BAF_INT_HOSTS
# [auto] IPv4 192.168.150.174/32 (System)
      - name: allow-udp-NETBIOS-DGM-LEGACY
        protocol: udp
        destination-port: NETBIOS-DGM-LEGACY
        action: accept
        source-address:
          - BAF_INT_HOSTS
# [auto] IPv4 192.168.150.174/32 (svchost C:\WINDOWS\system32\svchost.exe SSDPSRV) | IPv6 fe80::20bc:fb4d:fbe9:6cc3%6/128 (svchost C:\WINDOWS\system32\svchost.exe SSDPSRV)
      - name: deny-udp-SSDP
        protocol: udp
        destination-port: SSDP
        action: deny
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\System32\svchost.exe TermService) | IPv6 ::/0 (svchost C:\WINDOWS\System32\svchost.exe TermService)
      - name: allow-udp-RDP
        protocol: udp
        destination-port: RDP
        action: accept
        source-address:
          - BAF_INT_GT
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe CDPSvc)
      - name: allow-udp-UDP_5050
        protocol: udp
        destination-port: UDP_5050
        action: accept
        source-address: ANY_V4
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe Dnscache) | IPv6 ::/0 (svchost C:\WINDOWS\system32\svchost.exe Dnscache)
      - name: allow-udp-MDNS
        protocol: udp
        destination-port: MDNS
        action: accept
        source-address:
          - MDNS_SOURCES_V4
          - MDNS_SOURCES_V6
# [auto] IPv4 0.0.0.0/0 (svchost C:\WINDOWS\system32\svchost.exe Dnscache) | IPv6 ::/0 (svchost C:\WINDOWS\system32\svchost.exe Dnscache)
      - name: allow-udp-LLMNR
        protocol: udp
        destination-port: LLMNR
        action: accept
        source-address:
          - LLMNR_SOURCES_V4
          - LLMNR_SOURCES_V6
      - name: drop-ANY
        action: deny
        platform-exclude:
          - windows_advfirewall

# egress
  - header:
      targets:
        windows_advfirewall: out mixed
    terms:
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
      - name: allow-ANY
        action: accept
