        action: deny
        counter: drop-ANY

  - header:
      targets:
        nftables: mixed output
    terms:
      - name: allow-loopback
        action: accept
        source-address: LOOPBACK
      - name: allow-icmp
        action: accept
        protocol: icmp
      - name: allow-icmpv6
        action: accept
        protocol: icmpv6
# [auto] no egress flows observed — placeholder kept
      - name: allow-ANY
