metadata:
  host: bgp_20
  zone: bgp_20
  hosts:
  - hq-gsc01_bgp_05_berylia_org
  - hq-gsc02_bgp_05_berylia_org
  - hq-gsc03_bgp_05_berylia_org
  - hq-gsc04_bgp_05_berylia_org
  - hq-gsc05_bgp_05_berylia_org
  - hq-gsc06_bgp_05_berylia_org
  - hq-gsc07_bgp_05_berylia_org
  - hq-gsc08_bgp_05_berylia_org
  - hq-gsc09_bgp_05_berylia_org
  - mcs_bgp_05_berylia_org
filters:
- header:
    targets:
      nftables: mixed input
  terms:
  - name: allow-tcp-SSH-shared
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address: ANY
    comment: every one of 7 sources was answered
    destination-address: hq-gsc01_bgp_05_berylia_org hq-gsc02_bgp_05_berylia_org hq-gsc03_bgp_05_berylia_org
      hq-gsc04_bgp_05_berylia_org hq-gsc05_bgp_05_berylia_org hq-gsc06_bgp_05_berylia_org
      hq-gsc07_bgp_05_berylia_org hq-gsc08_bgp_05_berylia_org hq-gsc09_bgp_05_berylia_org
      mcs_bgp_05_berylia_org
  - name: allow-tcp-VNC-shared
    protocol: tcp
    destination-port: VNC
    action: accept
    source-address: ANY
    comment: every one of 5 sources was answered
    destination-address: hq-gsc01_bgp_05_berylia_org hq-gsc02_bgp_05_berylia_org hq-gsc03_bgp_05_berylia_org
      hq-gsc04_bgp_05_berylia_org hq-gsc05_bgp_05_berylia_org hq-gsc06_bgp_05_berylia_org
      hq-gsc07_bgp_05_berylia_org hq-gsc08_bgp_05_berylia_org hq-gsc09_bgp_05_berylia_org
  - name: allow-tcp-HTTP-ALT-shared
    protocol: tcp
    destination-port: HTTP-ALT
    action: accept
    source-address: ANY
    comment: every one of 3 sources was answered
    destination-address: hq-gsc01_bgp_05_berylia_org hq-gsc02_bgp_05_berylia_org hq-gsc03_bgp_05_berylia_org
      hq-gsc04_bgp_05_berylia_org hq-gsc05_bgp_05_berylia_org hq-gsc06_bgp_05_berylia_org
      hq-gsc07_bgp_05_berylia_org hq-gsc08_bgp_05_berylia_org hq-gsc09_bgp_05_berylia_org
  - name: allow-tcp-TCP_19000-shared
    protocol: tcp
    destination-port: TCP_19000
    action: accept
    source-address: ANY
    comment: every one of 1 sources was answered
    destination-address: hq-gsc01_bgp_05_berylia_org hq-gsc02_bgp_05_berylia_org hq-gsc03_bgp_05_berylia_org
      hq-gsc04_bgp_05_berylia_org hq-gsc05_bgp_05_berylia_org hq-gsc06_bgp_05_berylia_org
      hq-gsc07_bgp_05_berylia_org hq-gsc08_bgp_05_berylia_org hq-gsc09_bgp_05_berylia_org
  - name: hq-gsc08_bgp_05_berylia_org-allow-tcp-TCP_4533
    protocol: tcp
    destination-port: TCP_4533
    action: accept
    source-address: ANY
    comment: every one of 1 sources was answered
    destination-address: hq-gsc08_bgp_05_berylia_org
  - name: mcs_bgp_05_berylia_org-allow-tcp-HTTP
    protocol: tcp
    destination-port: HTTP
    action: accept
    source-address: ANY
    comment: every one of 1 sources was answered
    destination-address: mcs_bgp_05_berylia_org
  - name: mcs_bgp_05_berylia_org-allow-tcp-HTTPS
    protocol: tcp
    destination-port: HTTPS
    action: accept
    source-address: ANY
    comment: every one of 10 sources was answered
    destination-address: mcs_bgp_05_berylia_org
  - name: drop-ghost-hosts
    action: deny
    destination-address: bgp_20
    comment: 'Ghost host catch-all: drops traffic to IPs in bgp_20 not matched by
      any allow term above.  All legitimate hosts should appear in policies/pol/ and
      be covered by explicit allow terms.'
  - name: log-accept-ANY
    action: accept
    logging: true
    comment: 'INITIAL DEPLOYMENT: accept + log all unmatched traffic. Promote to log-drop
      (--terminal log-drop) once rules are stable.'
