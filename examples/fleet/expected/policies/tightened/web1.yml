# [auto] no flows observed in window — source unchanged
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept

# [auto] 434 flows total | 434 hits: EXTERNAL (198.51.100.104, 203.0.113.30, 203.0.113.144, 192.0.2.13 and 36 more) | via: HTTP/tcp/80
# [auto] ANY covers 40 unresolved src: 40 addresses in 3 blocks, widest /24: 192.0.2.0/24 (15 src, 158 hits), 198.51.100.0/24 (11 src, 145 hits), 203.0.113.0/24 (14 src, 131 hits) -- 40 of 40 are private address space, so they belong in the inventory rather than behind ANY
