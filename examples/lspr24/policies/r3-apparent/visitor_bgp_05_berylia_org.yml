metadata:
  host: visitor
  zone: bgp
  provenance: "flows_to_enforced.py \u2014 INFERRED, not a recovered configuration"
filters:
- header:
    targets:
      nftables: mixed input DROP
  terms:
  - name: allow-tcp-SSH
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address: ANY
    comment: every one of 3 sources was answered
  - name: allow-tcp-HTTP
    protocol: tcp
    destination-port: HTTP
    action: accept
    source-address: ANY
    comment: every one of 5 sources was answered
  - name: allow-tcp-HTTPS
    protocol: tcp
    destination-port: HTTPS
    action: accept
    source-address: ANY
    comment: 49 sources answered, 1 not
  - name: allow-tcp-TCP_5000
    protocol: tcp
    destination-port: TCP_5000
    action: accept
    source-address: ANY
    comment: every one of 37 sources was answered
  - name: drop-ANY
    action: deny
