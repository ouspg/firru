metadata:
  host: beg_17
  zone: beg_17
  hosts:
  - gas-historian_beg_05_berylia_org
  - gas-hmi_beg_05_berylia_org
filters:
- header:
    targets:
      nftables: mixed input
  terms:
  - name: allow-icmp-any-shared
    protocol: icmp
    action: accept
    destination-address: gas-historian_beg_05_berylia_org gas-hmi_beg_05_berylia_org
  - name: allow-icmpv6-any-shared
    protocol: icmpv6
    action: accept
    destination-address: gas-historian_beg_05_berylia_org gas-hmi_beg_05_berylia_org
  - name: allow-tcp-SSH-shared
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address:
    - BEG_17_GT
    - BEG_17_MGMT
    - MGMT_HOSTS
    destination-address: gas-historian_beg_05_berylia_org gas-hmi_beg_05_berylia_org
  - name: deny-ext-tcp-TCP_12349
    action: deny
    destination-address: gas-hmi_beg_05_berylia_org
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: TCP_12349
  - name: deny-ext-tcp-TCP_3000
    action: deny
    destination-address: gas-hmi_beg_05_berylia_org
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: TCP_3000
  - name: deny-ext-tcp-TCP_8000
    action: deny
    destination-address: gas-hmi_beg_05_berylia_org
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: TCP_8000
  - name: drop-ghost-hosts
    action: deny
    destination-address: beg_17
    comment: 'Ghost host catch-all: drops traffic to IPs in beg_17 not matched by
      any allow term above.  All legitimate hosts should appear in policies/pol/ and
      be covered by explicit allow terms.'
  - name: log-accept-ANY
    action: accept
    logging: true
    comment: 'INITIAL DEPLOYMENT: accept + log all unmatched traffic. Promote to log-drop
      (--terminal log-drop) once rules are stable.'
- header:
    targets:
      nftables: mixed output
  terms:
  - name: egress-TCP_1514-shared
    protocol: tcp
    destination-port: TCP_1514
    comment: 'ANY covers 1 unresolved dst: 1 address in 1 block, widest /32: 100.100.108.30/32
      (283 hits) -- a single destination: name it or deny it, ANY is not the answer
      either way'
    action: accept
    source-address: gas-historian_beg_05_berylia_org gas-hmi_beg_05_berylia_org
  - name: egress-TCP_1515-shared
    protocol: tcp
    destination-port: TCP_1515
    comment: 'ANY covers 1 unresolved dst: 1 address in 1 block, widest /32: 100.100.108.30/32
      (56 hits) -- a single destination: name it or deny it, ANY is not the answer
      either way'
    action: accept
    source-address: gas-historian_beg_05_berylia_org gas-hmi_beg_05_berylia_org
  - name: egress-TCP_4506-shared
    protocol: tcp
    destination-port: TCP_4506
    destination-address: salt-master_beg_05_berylia_org
    action: accept
    source-address: gas-historian_beg_05_berylia_org gas-hmi_beg_05_berylia_org
  - name: egress-DNS-UDP-shared
    protocol: udp
    destination-port: DNS-UDP
    comment: 'ANY covers 2 unresolved dst: 2 addresses in 2 blocks, widest /32: 2a07:1181:95:95::4/128
      (1167 hits), 100.95.95.4/32 (1149 hits) -- 1 of 2 sit in one group, so a named
      group would cover most of this'
    action: accept
    source-address: gas-historian_beg_05_berylia_org gas-hmi_beg_05_berylia_org
  - name: log-accept-ANY-egress
    action: accept
    logging: true
    comment: 'INITIAL DEPLOYMENT: accept + log all unmatched traffic. Promote to log-drop
      (--terminal log-drop) once rules are stable.'
