metadata:
  host: mail
  zone: baf_int
  provenance: "flows_to_enforced.py \u2014 INFERRED, not a recovered configuration"
filters:
- header:
    targets:
      nftables: mixed input DROP
  terms:
  - name: allow-tcp-SSH
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address: ANY
    comment: every one of 3 sources was answered
  - name: allow-tcp-SMTP
    protocol: tcp
    destination-port: SMTP
    action: accept
    source-address: ANY
    comment: every one of 4 sources was answered
  - name: allow-tcp-HTTP
    protocol: tcp
    destination-port: HTTP
    action: accept
    source-address: ANY
    comment: every one of 2 sources was answered
  - name: allow-tcp-HTTPS
    protocol: tcp
    destination-port: HTTPS
    action: accept
    source-address: ANY
    comment: every one of 7 sources was answered
  - name: allow-tcp-SMTPS
    protocol: tcp
    destination-port: SMTPS
    action: accept
    source-address: ANY
    comment: every one of 2 sources was answered
  - name: allow-tcp-SMTP-SUBMIT
    protocol: tcp
    destination-port: SMTP-SUBMIT
    action: accept
    source-address: ANY
    comment: every one of 2 sources was answered
  - name: allow-udp-NTP
    protocol: udp
    destination-port: NTP
    action: accept
    source-address: ANY
    comment: every one of 1 sources was answered
  - name: drop-ANY
    action: deny
