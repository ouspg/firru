metadata:
  host: ws3-baf05
  zone: baf_int
filters:
  - header:
      targets:
        nftables: mixed input DROP
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
# [auto] IPv4 0.0.0.0/0 | IPv6 ::/0
# [auto] unexpected owner: SSH no process attribution; expected sshd, dropbear, ssh.socket, sshd.socket, ssh.service, sshd.service
      - name: allow-tcp-SSH
        protocol: tcp
        destination-port: SSH
        action: accept
        source-address:
          - BAF_INT_GT
# [auto] IPv6 ::/0 (xrdp)
      - name: allow-tcp-RDP
        protocol: tcp
        destination-port: RDP
        action: accept
        source-address:
          - BAF_INT_GT
# [auto] IPv4 0.0.0.0/0 (ntpd), 10.5.11.45/32 (ntpd) | IPv6 2a07:1182:5:11::45/128 (ntpd), ::/0 (ntpd), fe80::250:56ff:fe89/128 (ntpd)
      - name: allow-udp-NTP
        protocol: udp
        destination-port: NTP
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (cups-browsed)
      - name: allow-udp-IPP
        protocol: udp
        destination-port: IPP
        action: accept
        source-address: ANY_V4
# [auto] IPv4 0.0.0.0/0 (avahi-daemon) | IPv6 ::/0 (avahi-daemon)
      - name: allow-udp-MDNS
        protocol: udp
        destination-port: MDNS
        action: accept
        source-address:
          - MDNS_SOURCES_V4
          - MDNS_SOURCES_V6
      - name: drop-ANY
        action: deny
        counter: drop-ANY

# egress
  - header:
      targets:
        nftables: mixed output
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
      - name: allow-ANY
        action: accept
