metadata:
  host: ws3-beg05
  zone: beg_int
  provenance: "flows_to_enforced.py \u2014 INFERRED, not a recovered configuration"
filters:
- header:
    targets:
      nftables: mixed input DROP
  terms:
  - name: allow-tcp-SSH
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address: ANY
    comment: 6 sources answered, 4 not
  - name: allow-udp-NTP
    protocol: udp
    destination-port: NTP
    action: accept
    source-address: ANY
    comment: every one of 1 sources was answered
  - name: drop-ANY
    action: deny
