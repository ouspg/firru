metadata:
  host: db1
  zone: SERVERS
filters:
  - header:
      targets:
        nftables: mixed input DROP
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
# [auto] IPv4 0.0.0.0/0 (sshd /usr/sbin/sshd) | IPv6 ::/0 (sshd /usr/sbin/sshd)
      - name: allow-tcp-SSH
        protocol: tcp
        destination-port: SSH
        action: accept
        source-address:
          - jump1
# [auto] IPv4 0.0.0.0/0 (postgres /usr/lib/postgresql/16/bin/postgres) | IPv6 ::/0 (postgres /usr/lib/postgresql/16/bin/postgres)
      - name: allow-tcp-POSTGRES
        protocol: tcp
        destination-port: POSTGRES
        action: accept
        source-address: web1
# [auto] IPv4 192.168.150.179/32 (systemd-network)
      - name: allow-udp-DHCP-CLIENT
        protocol: udp
        destination-port: DHCP-CLIENT
        action: accept
        source-address: ANY_V4
      - name: drop-ANY
        action: deny
        counter: drop-ANY

# egress
  - header:
      targets:
        nftables: mixed output
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
      - name: allow-ANY
        action: accept
