metadata:
  host: mail
  zone: baf_int
filters:
  - header:
      targets:
        windows_advfirewall: in mixed block
    terms:
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
# [auto] IPv4 0.0.0.0/0 (sshd C:\Program Files\OpenSSH\sshd.exe sshd) | IPv6 ::/0 (sshd C:\Program Files\OpenSSH\sshd.exe sshd)
      - name: allow-tcp-SSH
        protocol: tcp
        destination-port: SSH
        action: accept
        source-address:
          - BAF_INT_GT
          - BAF_INT_MGMT
          - MGMT_HOSTS
# [auto] IPv4 0.0.0.0/0 (MSExchangeFrontendTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\MSExchangeFrontendTransport.exe MSExchangeFrontEndTransport) | IPv6 ::/0 (MSExchangeFrontendTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\MSExchangeFrontendTransport.exe MSExchangeFrontEndTransport)
      - name: allow-tcp-SMTP
        protocol: tcp
        destination-port: SMTP
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System) | aliases: HTTP,WINDOWS-HYPERV-REPLICA-HTTP
      - name: allow-tcp-HTTP
        protocol: tcp
        destination-port: HTTP
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System)
      - name: allow-tcp-TCP_81
        protocol: tcp
        destination-port: TCP_81
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (svchost C:\Windows\system32\svchost.exe RpcEptMapper RpcSs) | IPv6 ::/0 (svchost C:\Windows\system32\svchost.exe RpcEptMapper RpcSs)
      - name: allow-tcp-WINDOWS-RPC-ENDPOINT-MAPPER
        protocol: tcp
        destination-port: WINDOWS-RPC-ENDPOINT-MAPPER
        action: accept
        source-address: ANY
# [auto] IPv4 10.5.11.5/32 (System)
      - name: allow-tcp-NETBIOS-SSN-LEGACY
        protocol: tcp
        destination-port: NETBIOS-SSN-LEGACY
        action: accept
        source-address:
          - BAF_INT_HOSTS
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System) | aliases: HTTPS,WINDOWS-HYPERV-REPLICA-HTTPS
      - name: allow-tcp-HTTPS
        protocol: tcp
        destination-port: HTTPS
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System)
      - name: allow-tcp-TCP_444
        protocol: tcp
        destination-port: TCP_444
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System)
      - name: allow-tcp-WINDOWS-SMB
        protocol: tcp
        destination-port: WINDOWS-SMB
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (EdgeTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\edgetransport.exe) | IPv6 ::/0 (EdgeTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\edgetransport.exe)
      - name: allow-tcp-SMTPS
        protocol: tcp
        destination-port: SMTPS
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (MSExchangeDelivery C:\Program Files\Microsoft\Exchange Server\V15\Bin\MSExchangeDelivery.exe MSExchangeDelivery) | IPv6 ::/0 (MSExchangeDelivery C:\Program Files\Microsoft\Exchange Server\V15\Bin\MSExchangeDelivery.exe MSExchangeDelivery)
      - name: allow-tcp-MSEXCHANGEDELIVERY
        protocol: tcp
        destination-port: MSEXCHANGEDELIVERY
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (MSExchangeFrontendTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\MSExchangeFrontendTransport.exe MSExchangeFrontEndTransport) | IPv6 ::/0 (MSExchangeFrontendTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\MSExchangeFrontendTransport.exe MSExchangeFrontEndTransport)
      - name: allow-tcp-SMTP-SUBMIT
        protocol: tcp
        destination-port: SMTP-SUBMIT
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (svchost C:\Windows\system32\svchost.exe RpcEptMapper RpcSs) | IPv6 ::/0 (svchost C:\Windows\system32\svchost.exe RpcEptMapper RpcSs)
      - name: allow-tcp-WINDOWS-RPC-HTTPS
        protocol: tcp
        destination-port: WINDOWS-RPC-HTTPS
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (MSExchangeFrontendTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\MSExchangeFrontendTransport.exe MSExchangeFrontEndTransport) | IPv6 ::/0 (MSExchangeFrontendTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\MSExchangeFrontendTransport.exe MSExchangeFrontEndTransport)
      - name: allow-tcp-MSEXCHANGEFRONTENDTRANSPORT
        protocol: tcp
        destination-port: MSEXCHANGEFRONTENDTRANSPORT
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (SMSvcHost C:\Windows\Microsoft.NET\Framework64\v4.0.30319\SMSvcHost.exe NetPipeActivator NetTcpActivator NetTcpPortSharing) | IPv6 ::/0 (SMSvcHost C:\Windows\Microsoft.NET\Framework64\v4.0.30319\SMSvcHost.exe NetPipeActivator NetTcpActivator NetTcpPortSharing)
      - name: allow-tcp-SMSVCHOST
        protocol: tcp
        destination-port: SMSVCHOST
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (Microsoft.Exchange.Directory.TopologyService C:\Program Files\Microsoft\Exchange Server\V15\Bin\Microsoft.Exchange.Directory.TopologyService.exe MSExchangeADTopology) | IPv6 ::/0 (Microsoft.Exchange.Directory.TopologyService C:\Program Files\Microsoft\Exchange Server\V15\Bin\Microsoft.Exchange.Directory.TopologyService.exe MSExchangeADTopology)
      - name: allow-tcp-MSEXCHANGEADTOPOLOGY
        protocol: tcp
        destination-port: MSEXCHANGEADTOPOLOGY
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (EdgeTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\edgetransport.exe) | IPv6 ::/0 (EdgeTransport C:\Program Files\Microsoft\Exchange Server\V15\Bin\edgetransport.exe)
      - name: allow-tcp-EDGETRANSPORT
        protocol: tcp
        destination-port: EDGETRANSPORT
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (svchost C:\Windows\System32\svchost.exe TermService) | IPv6 ::/0 (svchost C:\Windows\System32\svchost.exe TermService)
      - name: allow-tcp-RDP
        protocol: tcp
        destination-port: RDP
        action: accept
        source-address:
          - BAF_INT_GT
          - BAF_INT_MGMT
          - MGMT_HOSTS
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System)
      - name: allow-tcp-TCP_3800
        protocol: tcp
        destination-port: TCP_3800
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (hostcontrollerservice C:\Program Files\Microsoft\Exchange Server\V15\Bin\Search\Ceres\HostController\hostcontrollerservice.exe HostControllerService) | IPv6 ::/0 (hostcontrollerservice C:\Program Files\Microsoft\Exchange Server\V15\Bin\Search\Ceres\HostController\hostcontrollerservice.exe HostControllerService)
      - name: allow-tcp-HOSTCONTROLLERSERVICE
        protocol: tcp
        destination-port: HOSTCONTROLLERSERVICE
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (noderunner C:\Program Files\Microsoft\Exchange Server\V15\Bin\Search\Ceres\Runtime\1.0\NodeRunner.exe) | IPv6 ::/0 (noderunner C:\Program Files\Microsoft\Exchange Server\V15\Bin\Search\Ceres\Runtime\1.0\NodeRunner.exe)
      - name: allow-tcp-NODERUNNER
        protocol: tcp
        destination-port: NODERUNNER
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (System) | IPv6 ::/0 (System)
      - name: allow-tcp-WINRM-HTTP
        protocol: tcp
        destination-port: WINRM-HTTP
        action: accept
        source-address:
          - BAF_INT_GT
          - BAF_INT_MGMT
          - MGMT_HOSTS
# [auto] IPv4 0.0.0.0/0 (Microsoft.Exchange.RpcClientAccess.Service C:\Program Files\Microsoft\Exchange Server\V15\bin\Microsoft.Exchange.RpcClientAccess.Service.exe MSExchangeRPC) | IPv6 ::/0 (Microsoft.Exchange.RpcClientAccess.Service C:\Program Files\Microsoft\Exchange Server\V15\bin\Microsoft.Exchange.RpcClientAccess.Service.exe MSExchangeRPC)
      - name: allow-tcp-MSEXCHANGERPC
        protocol: tcp
        destination-port: MSEXCHANGERPC
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (msexchangerepl C:\Program Files\Microsoft\Exchange Server\V15\Bin\msexchangerepl.exe MSExchangeRepl) | IPv6 ::/0 (msexchangerepl C:\Program Files\Microsoft\Exchange Server\V15\Bin\msexchangerepl.exe MSExchangeRepl)
      - name: allow-tcp-WINDOWS-RPC-DYNAMIC
        protocol: tcp
        destination-port: WINDOWS-RPC-DYNAMIC
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (svchost C:\Windows\system32\svchost.exe W32Time) | IPv6 ::/0 (svchost C:\Windows\system32\svchost.exe W32Time)
      - name: allow-udp-NTP
        protocol: udp
        destination-port: NTP
        action: accept
        source-address: ANY
# [auto] IPv4 10.5.11.5/32 (System)
      - name: allow-udp-NETBIOS-NS-LEGACY
        protocol: udp
        destination-port: NETBIOS-NS-LEGACY
        action: accept
        source-address:
          - BAF_INT_HOSTS
# [auto] IPv4 10.5.11.5/32 (System)
      - name: allow-udp-NETBIOS-DGM-LEGACY
        protocol: udp
        destination-port: NETBIOS-DGM-LEGACY
        action: accept
        source-address:
          - BAF_INT_HOSTS
# [auto] IPv4 0.0.0.0/0 (svchost C:\Windows\System32\svchost.exe TermService) | IPv6 ::/0 (svchost C:\Windows\System32\svchost.exe TermService)
      - name: allow-udp-RDP
        protocol: udp
        destination-port: RDP
        action: accept
        source-address:
          - BAF_INT_GT
          - BAF_INT_MGMT
          - MGMT_HOSTS
# [auto] IPv4 0.0.0.0/0 (svchost C:\Windows\system32\svchost.exe Dnscache) | IPv6 ::/0 (svchost C:\Windows\system32\svchost.exe Dnscache)
      - name: allow-udp-MDNS
        protocol: udp
        destination-port: MDNS
        action: accept
        source-address:
          - MDNS_SOURCES_V4
          - MDNS_SOURCES_V6
# [auto] IPv4 0.0.0.0/0 (svchost C:\Windows\system32\svchost.exe Dnscache) | IPv6 ::/0 (svchost C:\Windows\system32\svchost.exe Dnscache)
      - name: allow-udp-LLMNR
        protocol: udp
        destination-port: LLMNR
        action: accept
        source-address:
          - LLMNR_SOURCES_V4
          - LLMNR_SOURCES_V6
      - name: drop-ANY
        action: deny
        platform-exclude:
          - windows_advfirewall

# egress
  - header:
      targets:
        windows_advfirewall: out mixed
    terms:
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
      - name: allow-ANY
        action: accept
