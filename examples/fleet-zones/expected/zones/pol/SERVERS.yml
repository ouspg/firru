metadata:
  host: SERVERS
  zone: SERVERS
  hosts:
  - db1
  - dc1
  - files1
  - print1
  - smb1
filters:
- header:
    targets:
      nftables: mixed input
  terms:
  - name: allow-icmp-any-shared
    protocol: icmp
    action: accept
    destination-address: SERVERS_HOSTS
  - name: allow-icmpv6-any-shared
    protocol: icmpv6
    action: accept
    destination-address: SERVERS_HOSTS
  - name: allow-tcp-SSH-shared
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address:
    - jump1
    destination-address: db1 smb1
  - name: db1-allow-tcp-POSTGRES
    protocol: tcp
    destination-port: POSTGRES
    action: accept
    source-address: web1
    destination-address: db1
  - name: db1-allow-udp-DHCP-CLIENT
    protocol: udp
    destination-port: DHCP-CLIENT
    action: accept
    source-address: ANY_V4
    destination-address: db1
  - name: dc1-allow-tcp-DNS-TCP
    protocol: tcp
    destination-port: DNS-TCP
    action: accept
    source-address: ANY
    destination-address: dc1
  - name: dc1-allow-tcp-KERBEROS-TCP
    protocol: tcp
    destination-port: KERBEROS-TCP
    action: accept
    source-address: CLIENTS_HOSTS
    destination-address: dc1
  - name: dc1-allow-tcp-WINDOWS-RPC-ENDPOINT-MAPPER
    protocol: tcp
    destination-port: WINDOWS-RPC-ENDPOINT-MAPPER
    action: accept
    source-address: CLIENTS_HOSTS
    destination-address: dc1
  - name: allow-tcp-WINDOWS-RPC-ENDPOINT-MAPPER-from-ANY-shared
    protocol: tcp
    destination-port: WINDOWS-RPC-ENDPOINT-MAPPER
    action: accept
    source-address: ANY
    destination-address: files1 print1
  - name: dc1-allow-tcp-LDAP-TCP
    protocol: tcp
    destination-port: LDAP-TCP
    action: accept
    source-address: CLIENTS_HOSTS
    destination-address: dc1
  - name: allow-tcp-WINDOWS-SMB-from-CLIENTS_HOSTS-shared
    protocol: tcp
    destination-port: WINDOWS-SMB
    action: accept
    source-address: CLIENTS_HOSTS
    destination-address: dc1 files1
  - name: allow-tcp-WINDOWS-SMB-from-ANY-shared
    protocol: tcp
    destination-port: WINDOWS-SMB
    action: accept
    source-address: ANY
    destination-address: print1 smb1
  - name: dc1-allow-tcp-KERBEROS-KPASSWD-TCP
    protocol: tcp
    destination-port: KERBEROS-KPASSWD-TCP
    action: accept
    source-address: ANY
    destination-address: dc1
  - name: dc1-allow-tcp-WINDOWS-RPC-HTTPS
    protocol: tcp
    destination-port: WINDOWS-RPC-HTTPS
    action: accept
    source-address: ANY
    destination-address: dc1
  - name: dc1-allow-tcp-LDAPS
    protocol: tcp
    destination-port: LDAPS
    action: accept
    source-address: ANY
    destination-address: dc1
  - name: dc1-allow-tcp-LDAP-GC
    protocol: tcp
    destination-port: LDAP-GC
    action: accept
    source-address: ANY
    destination-address: dc1
  - name: dc1-allow-tcp-LDAP-GC-SSL
    protocol: tcp
    destination-port: LDAP-GC-SSL
    action: accept
    source-address: ANY
    destination-address: dc1
  - name: allow-tcp-WINRM-HTTP-shared
    protocol: tcp
    destination-port: WINRM-HTTP
    action: accept
    source-address:
    - jump1
    destination-address: dc1 files1 print1
  - name: dc1-allow-tcp-WINDOWS-AD-ADWS
    protocol: tcp
    destination-port: WINDOWS-AD-ADWS
    action: accept
    source-address: ANY
    destination-address: dc1
  - name: allow-tcp-WINDOWS-WINRM-UNCONFIGURED-shared
    protocol: tcp
    destination-port: WINDOWS-WINRM-UNCONFIGURED
    action: accept
    source-address: ANY
    destination-address: dc1 files1 print1
  - name: dc1-allow-udp-DNS-UDP
    protocol: udp
    destination-port: DNS-UDP
    action: accept
    source-address: ANY
    destination-address: dc1
  - name: dc1-allow-udp-KERBEROS-UDP
    protocol: udp
    destination-port: KERBEROS-UDP
    action: accept
    source-address: ANY
    destination-address: dc1
  - name: allow-udp-NTP-shared
    protocol: udp
    destination-port: NTP
    action: accept
    source-address: ANY
    destination-address: dc1 files1 print1
  - name: dc1-allow-udp-LDAP-UDP
    protocol: udp
    destination-port: LDAP-UDP
    action: accept
    source-address: ANY
    destination-address: dc1
  - name: dc1-allow-udp-KERBEROS-KPASSWD-UDP
    protocol: udp
    destination-port: KERBEROS-KPASSWD-UDP
    action: accept
    source-address: ANY
    destination-address: dc1
  - name: deny-ext-tcp-NETBIOS-SSN-LEGACY
    action: deny
    destination-address: dc1 files1 print1
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: NETBIOS-SSN-LEGACY
  - name: deny-ext-udp-NETBIOS-DGM-LEGACY
    action: deny
    destination-address: dc1 files1 print1
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: udp
    destination-port: NETBIOS-DGM-LEGACY
  - name: deny-ext-udp-NETBIOS-NS-LEGACY
    action: deny
    destination-address: dc1 files1 print1
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: udp
    destination-port: NETBIOS-NS-LEGACY
  - name: drop-ghost-hosts
    action: deny
    destination-address: SERVERS
    comment: 'Ghost host catch-all: drops traffic to IPs in SERVERS not matched by
      any allow term above.  All legitimate hosts should appear in policies/pol/ and
      be covered by explicit allow terms.'
  - name: log-drop-ANY
    action: deny
    logging: true
    comment: 'SETTLING: drop + log unmatched traffic to catch false positives. Promote
      to drop (--terminal drop) when the log has been quiet.'
