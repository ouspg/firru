metadata:
  host: MGMT
  zone: MGMT
  hosts:
  - jump1
filters:
- header:
    targets:
      nftables: mixed input
  terms:
  - name: jump1-allow-icmp
    protocol: icmp
    action: accept
    destination-address: jump1
  - name: jump1-allow-icmpv6
    protocol: icmpv6
    action: accept
    destination-address: jump1
  - name: jump1-allow-udp-DHCP-CLIENT
    protocol: udp
    destination-port: DHCP-CLIENT
    action: accept
    source-address: ANY_V4
    destination-address: jump1
  - name: deny-ext-tcp-SSH
    action: deny
    destination-address: jump1
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: SSH
  - name: drop-ghost-hosts
    action: deny
    destination-address: MGMT
    comment: 'Ghost host catch-all: drops traffic to IPs in MGMT not matched by any
      allow term above.  All legitimate hosts should appear in policies/pol/ and be
      covered by explicit allow terms.'
  - name: log-drop-ANY
    action: deny
    logging: true
    comment: 'SETTLING: drop + log unmatched traffic to catch false positives. Promote
      to drop (--terminal drop) when the log has been quiet.'
