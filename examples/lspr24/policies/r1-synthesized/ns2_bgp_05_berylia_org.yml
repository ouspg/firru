metadata:
  host: ns2
  zone: bgp
filters:
  - header:
      targets:
        nftables: mixed input DROP
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
# [auto] IPv4 0.0.0.0/0 | IPv6 ::/0
# [auto] unexpected owner: SSH no process attribution; expected sshd, dropbear, ssh.socket, sshd.socket, ssh.service, sshd.service
      - name: allow-tcp-SSH
        protocol: tcp
        destination-port: SSH
        action: accept
        source-address:
          - BGP_GT
# [auto] IPv4 0.0.0.0/0 (unbound) | IPv6 ::/0 (unbound)
      - name: allow-tcp-DNS-TCP
        protocol: tcp
        destination-port: DNS-TCP
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (nsd) | IPv6 ::/0 (nsd)
      - name: allow-tcp-TCP_5353
        protocol: tcp
        destination-port: TCP_5353
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (unbound) | IPv6 ::/0 (unbound)
      - name: allow-udp-DNS-UDP
        protocol: udp
        destination-port: DNS-UDP
        action: accept
        source-address: ANY
# [auto] IPv4 0.0.0.0/0 (nsd) | IPv6 ::/0 (nsd)
      - name: allow-udp-MDNS
        protocol: udp
        destination-port: MDNS
        action: accept
        source-address:
          - MDNS_SOURCES_V4
          - MDNS_SOURCES_V6
      - name: drop-ANY
        action: deny
        counter: drop-ANY

# egress
  - header:
      targets:
        nftables: mixed output
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
      - name: allow-ANY
        action: accept
