metadata:
  host: xroad-securityserver
  zone: bgp
  provenance: "flows_to_enforced.py \u2014 INFERRED, not a recovered configuration"
filters:
- header:
    targets:
      nftables: mixed input DROP
  terms:
  - name: allow-tcp-SSH
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address: ANY
    comment: every one of 3 sources was answered
  - name: allow-tcp-HTTPS
    protocol: tcp
    destination-port: HTTPS
    action: accept
    source-address: ANY
    comment: every one of 5 sources was answered
  - name: allow-tcp-TCP_5500
    protocol: tcp
    destination-port: TCP_5500
    action: accept
    source-address: ANY
    comment: every one of 16 sources was answered
  - name: allow-tcp-TCP_5577
    protocol: tcp
    destination-port: TCP_5577
    action: accept
    source-address: ANY
    comment: every one of 11 sources was answered
  - name: allow-tcp-TCP_5588
    protocol: tcp
    destination-port: TCP_5588
    action: accept
    source-address: ANY
    comment: every one of 2 sources was answered
  - name: drop-ANY
    action: deny
