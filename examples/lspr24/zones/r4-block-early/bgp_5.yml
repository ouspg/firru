metadata:
  host: bgp_5
  zone: bgp_5
  hosts:
  - alert-system_bgp_05_berylia_org
  - entry_bgp_05_berylia_org
  - imagery_bgp_05_berylia_org
  - keycloak_bgp_05_berylia_org
  - lims_bgp_05_berylia_org
  - nextcloud_bgp_05_berylia_org
  - ns1_bgp_05_berylia_org
  - ns2_bgp_05_berylia_org
  - visitor_bgp_05_berylia_org
  - whistleblowhub_bgp_05_berylia_org
  - www_bgp_05_berylia_org
  - xroad-securityserver_bgp_05_berylia_org
filters:
- header:
    targets:
      nftables: mixed input
  terms:
  - name: allow-icmp-any-shared
    protocol: icmp
    action: accept
    destination-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org
      imagery_bgp_05_berylia_org keycloak_bgp_05_berylia_org lims_bgp_05_berylia_org
      nextcloud_bgp_05_berylia_org ns1_bgp_05_berylia_org ns2_bgp_05_berylia_org visitor_bgp_05_berylia_org
      whistleblowhub_bgp_05_berylia_org www_bgp_05_berylia_org xroad-securityserver_bgp_05_berylia_org
  - name: allow-icmpv6-any-shared
    protocol: icmpv6
    action: accept
    destination-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org
      imagery_bgp_05_berylia_org keycloak_bgp_05_berylia_org lims_bgp_05_berylia_org
      nextcloud_bgp_05_berylia_org ns1_bgp_05_berylia_org ns2_bgp_05_berylia_org visitor_bgp_05_berylia_org
      whistleblowhub_bgp_05_berylia_org www_bgp_05_berylia_org xroad-securityserver_bgp_05_berylia_org
  - name: alert-system_bgp_05_berylia_org-allow-tcp-SSH
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address:
    - BGP_5_GT
    - MGMT_HOSTS
    destination-address: alert-system_bgp_05_berylia_org
  - name: deny-ext-tcp-HTTP
    action: deny
    destination-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org
      imagery_bgp_05_berylia_org lims_bgp_05_berylia_org nextcloud_bgp_05_berylia_org
      visitor_bgp_05_berylia_org whistleblowhub_bgp_05_berylia_org www_bgp_05_berylia_org
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: HTTP
  - name: deny-ext-tcp-HTTPS
    action: deny
    destination-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org
      imagery_bgp_05_berylia_org keycloak_bgp_05_berylia_org lims_bgp_05_berylia_org
      nextcloud_bgp_05_berylia_org visitor_bgp_05_berylia_org whistleblowhub_bgp_05_berylia_org
      www_bgp_05_berylia_org xroad-securityserver_bgp_05_berylia_org
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: HTTPS
  - name: deny-ext-tcp-SSH
    action: deny
    destination-address: entry_bgp_05_berylia_org imagery_bgp_05_berylia_org keycloak_bgp_05_berylia_org
      lims_bgp_05_berylia_org nextcloud_bgp_05_berylia_org ns1_bgp_05_berylia_org
      ns2_bgp_05_berylia_org visitor_bgp_05_berylia_org whistleblowhub_bgp_05_berylia_org
      www_bgp_05_berylia_org xroad-securityserver_bgp_05_berylia_org
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: SSH
  - name: deny-ext-tcp-TCP_5588
    action: deny
    destination-address: xroad-securityserver_bgp_05_berylia_org
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: TCP_5588
  - name: drop-ghost-hosts
    action: deny
    destination-address: bgp_5
    comment: 'Ghost host catch-all: drops traffic to IPs in bgp_5 not matched by any
      allow term above.  All legitimate hosts should appear in policies/pol/ and be
      covered by explicit allow terms.'
  - name: log-accept-ANY
    action: accept
    logging: true
    comment: 'INITIAL DEPLOYMENT: accept + log all unmatched traffic. Promote to log-drop
      (--terminal log-drop) once rules are stable.'
- header:
    targets:
      nftables: mixed output
  terms:
  - name: egress-TCP_1514-shared
    protocol: tcp
    destination-port: TCP_1514
    comment: 'ANY covers 1 unresolved dst: 1 address in 1 block, widest /32: 100.100.108.30/32
      (4578 hits) -- a single destination: name it or deny it, ANY is not the answer
      either way'
    action: accept
    source-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org imagery_bgp_05_berylia_org
      keycloak_bgp_05_berylia_org lims_bgp_05_berylia_org nextcloud_bgp_05_berylia_org
      ns1_bgp_05_berylia_org ns2_bgp_05_berylia_org visitor_bgp_05_berylia_org whistleblowhub_bgp_05_berylia_org
      www_bgp_05_berylia_org xroad-securityserver_bgp_05_berylia_org
  - name: egress-TCP_1515-shared
    protocol: tcp
    destination-port: TCP_1515
    comment: 'ANY covers 1 unresolved dst: 1 address in 1 block, widest /32: 100.100.108.30/32
      (917 hits) -- a single destination: name it or deny it, ANY is not the answer
      either way'
    action: accept
    source-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org imagery_bgp_05_berylia_org
      keycloak_bgp_05_berylia_org lims_bgp_05_berylia_org nextcloud_bgp_05_berylia_org
      ns1_bgp_05_berylia_org ns2_bgp_05_berylia_org visitor_bgp_05_berylia_org whistleblowhub_bgp_05_berylia_org
      www_bgp_05_berylia_org xroad-securityserver_bgp_05_berylia_org
  - name: egress-DNS-UDP-shared
    protocol: udp
    destination-port: DNS-UDP
    comment: 'ANY covers 2 unresolved dst: 2 addresses in 2 blocks, widest /32: 2a07:1181:95:95::4/128
      (1436 hits), 100.95.95.4/32 (1030 hits) -- 1 of 2 sit in one group, so a named
      group would cover most of this'
    action: accept
    source-address: alert-system_bgp_05_berylia_org entry_bgp_05_berylia_org imagery_bgp_05_berylia_org
      keycloak_bgp_05_berylia_org lims_bgp_05_berylia_org nextcloud_bgp_05_berylia_org
      ns1_bgp_05_berylia_org ns2_bgp_05_berylia_org visitor_bgp_05_berylia_org whistleblowhub_bgp_05_berylia_org
      www_bgp_05_berylia_org xroad-securityserver_bgp_05_berylia_org
  - name: visitor_bgp_05_berylia_org-egress-DNS-TCP
    protocol: tcp
    destination-port: DNS-TCP
    comment: 'ANY covers 1 unresolved dst: 1 address in 1 block, widest /128: 2a07:1181:95:95::4/128
      (965 hits) -- a single destination: name it or deny it, ANY is not the answer
      either way'
    action: accept
    source-address: visitor_bgp_05_berylia_org
  - name: log-accept-ANY-egress
    action: accept
    logging: true
    comment: 'INITIAL DEPLOYMENT: accept + log all unmatched traffic. Promote to log-drop
      (--terminal log-drop) once rules are stable.'
