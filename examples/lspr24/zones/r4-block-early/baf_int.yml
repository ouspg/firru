    protocol: icmp
    action: accept
    destination-address: mail_int_baf_05_berylia_org ticketdesk_int_baf_05_berylia_org
      ws1-baf01_int_baf_05_berylia_org ws3-baf05_int_baf_05_berylia_org
  - name: allow-icmpv6-any-shared
    protocol: icmpv6
    action: accept
    destination-address: mail_int_baf_05_berylia_org ticketdesk_int_baf_05_berylia_org
      ws1-baf01_int_baf_05_berylia_org ws3-baf05_int_baf_05_berylia_org
  - name: deny-ext-tcp-HTTP
    action: deny
    destination-address: mail_int_baf_05_berylia_org ticketdesk_int_baf_05_berylia_org
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: HTTP
  - name: deny-ext-tcp-HTTPS
