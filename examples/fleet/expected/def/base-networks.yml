# Networks that firru's generated policies name. Every site needs these, so
# they ship with the service definitions; add your own networks (hosts,
# segments, management) in a file of your own beside them.
#   ANY, ANY_V4, ANY_V6  every address (a term firru could not narrow)
#   LOOPBACK             the host itself
#   MDNS_SOURCES_*, LLMNR_SOURCES_*  where link-local name resolution comes
#                        from: firru.src_heuristics scopes mDNS and LLMNR
#                        terms to these instead of ANY
networks:
  ANY_V4:
    values:
      - address: 0.0.0.0/0
  ANY_V6:
    values:
      - address: ::/0
  ANY:
    values:
      - name: ANY_V4
      - name: ANY_V6
  LOOPBACK:
    values:
      - address: 127.0.0.0/8
      - address: ::1/128
  MDNS_SOURCES_V4:
    values:
      - address: 224.0.0.251/32
      - address: 169.254.0.0/16
  MDNS_SOURCES_V6:
    values:
      - address: ff02::fb/128
      - address: fe80::/10
  LLMNR_SOURCES_V4:
    values:
      - address: 224.0.0.252/32
      - address: 169.254.0.0/16
  LLMNR_SOURCES_V6:
    values:
      - address: ff02::1:3/128
      - address: fe80::/10
