metadata:
  host: smb1
  zone: SERVERS
filters:
  - header:
      targets:
        nftables: mixed input DROP
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
# [auto] IPv4 0.0.0.0/0 (sshd) | IPv6 ::/0 (sshd)
      - name: allow-tcp-SSH
        protocol: tcp
        destination-port: SSH
        action: accept
        source-address:
          - jump1
# [auto] IPv4 0.0.0.0/0 (smbd /usr/sbin/smbd) | IPv6 ::/0 (smbd /usr/sbin/smbd)
      - name: allow-tcp-WINDOWS-SMB
        protocol: tcp
        destination-port: WINDOWS-SMB
        action: accept
        source-address: ANY
      - name: drop-ANY
        action: deny
        counter: drop-ANY

# egress
  - header:
      targets:
        nftables: mixed output
    terms:
      - name: allow-loopback
        source-address: LOOPBACK
        action: accept
      - name: allow-icmp
        protocol: icmp
        action: accept
      - name: allow-icmpv6
        protocol: icmpv6
        action: accept
      - name: allow-ANY
        action: accept
