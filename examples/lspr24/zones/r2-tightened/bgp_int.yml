metadata:
  host: bgp_int
  zone: bgp_int
  hosts:
  - cctv-ai-monitor_int_bgp_05_berylia_org
  - ws6-m365_int_bgp_05_berylia_org
filters:
- header:
    targets:
      nftables: mixed input
  terms:
  - name: allow-icmp-any-shared
    protocol: icmp
    action: accept
    destination-address: cctv-ai-monitor_int_bgp_05_berylia_org ws6-m365_int_bgp_05_berylia_org
  - name: allow-icmpv6-any-shared
    protocol: icmpv6
    action: accept
    destination-address: cctv-ai-monitor_int_bgp_05_berylia_org ws6-m365_int_bgp_05_berylia_org
  - name: cctv-ai-monitor_int_bgp_05_berylia_org-allow-tcp-HTTP
    protocol: tcp
    destination-port: HTTP
    action: accept
    source-address: ANY
    destination-address: cctv-ai-monitor_int_bgp_05_berylia_org
  - name: cctv-ai-monitor_int_bgp_05_berylia_org-allow-tcp-HTTPS
    protocol: tcp
    destination-port: HTTPS
    action: accept
    source-address: ANY
    destination-address: cctv-ai-monitor_int_bgp_05_berylia_org
  - name: deny-ext-tcp-RDP
    action: deny
    destination-address: ws6-m365_int_bgp_05_berylia_org
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: RDP
  - name: deny-ext-tcp-SSH
    action: deny
    destination-address: cctv-ai-monitor_int_bgp_05_berylia_org ws6-m365_int_bgp_05_berylia_org
    comment: "intra-zone only \u2014 port is open on host(s) but no legitimate external\
      \ traffic observed; host firewall handles intra-zone access"
    protocol: tcp
    destination-port: SSH
  - name: drop-ghost-hosts
    action: deny
    destination-address: bgp_int
    comment: 'Ghost host catch-all: drops traffic to IPs in bgp_int not matched by
      any allow term above.  All legitimate hosts should appear in policies/pol/ and
      be covered by explicit allow terms.'
  - name: log-accept-ANY
    action: accept
    logging: true
    comment: 'INITIAL DEPLOYMENT: accept + log all unmatched traffic. Promote to log-drop
      (--terminal log-drop) once rules are stable.'
- header:
    targets:
      nftables: mixed output
  terms:
  - name: cctv-ai-monitor_int_bgp_05_berylia_org-egress-DNS-TCP
    protocol: tcp
    destination-port: DNS-TCP
    comment: 'ANY covers 1 unresolved dst: 1 address in 1 block, widest /128: 2a07:1181:95:95::4/128
      (9194 hits) -- a single destination: name it or deny it, ANY is not the answer
      either way'
    action: accept
    source-address: cctv-ai-monitor_int_bgp_05_berylia_org
  - name: egress-TCP_1514-shared
    protocol: tcp
    destination-port: TCP_1514
    comment: 'ANY covers 1 unresolved dst: 1 address in 1 block, widest /32: 100.100.108.30/32
      (4406 hits) -- a single destination: name it or deny it, ANY is not the answer
      either way'
    action: accept
    source-address: cctv-ai-monitor_int_bgp_05_berylia_org ws6-m365_int_bgp_05_berylia_org
  - name: egress-TCP_1515-shared
    protocol: tcp
    destination-port: TCP_1515
    comment: 'ANY covers 1 unresolved dst: 1 address in 1 block, widest /32: 100.100.108.30/32
      (882 hits) -- a single destination: name it or deny it, ANY is not the answer
      either way'
    action: accept
    source-address: cctv-ai-monitor_int_bgp_05_berylia_org ws6-m365_int_bgp_05_berylia_org
  - name: egress-DNS-UDP-shared
    protocol: udp
    destination-port: DNS-UDP
    comment: 'ANY covers 2 unresolved dst: 2 addresses in 2 blocks, widest /32: 100.95.95.4/32
      (31329 hits), 2a07:1181:95:95::4/128 (11215 hits) -- 1 of 2 sit in one group,
      so a named group would cover most of this'
    action: accept
    source-address: cctv-ai-monitor_int_bgp_05_berylia_org ws6-m365_int_bgp_05_berylia_org
  - name: log-accept-ANY-egress
    action: accept
    logging: true
    comment: 'INITIAL DEPLOYMENT: accept + log all unmatched traffic. Promote to log-drop
      (--terminal log-drop) once rules are stable.'
