metadata:
  host: bgp_sac
  zone: bgp_sac
  hosts:
  - fiveg-ue-bgp01_sac_bgp_05_berylia_org
  - fiveg-ue-bgp02_sac_bgp_05_berylia_org
  - fiveg-ue-bgp03_sac_bgp_05_berylia_org
filters:
- header:
    targets:
      nftables: mixed input
  terms:
  - name: allow-tcp-SSH-shared
    protocol: tcp
    destination-port: SSH
    action: accept
    source-address: BGP_INT_GT_OTHER
    destination-address: fiveg-ue-bgp01_sac_bgp_05_berylia_org fiveg-ue-bgp02_sac_bgp_05_berylia_org
      fiveg-ue-bgp03_sac_bgp_05_berylia_org
  - name: allow-icmp-any-shared
    protocol: icmp
    action: accept
    destination-address: fiveg-ue-bgp01_sac_bgp_05_berylia_org fiveg-ue-bgp02_sac_bgp_05_berylia_org
      fiveg-ue-bgp03_sac_bgp_05_berylia_org
  - name: allow-icmpv6-any-shared
    protocol: icmpv6
    action: accept
    destination-address: fiveg-ue-bgp01_sac_bgp_05_berylia_org fiveg-ue-bgp02_sac_bgp_05_berylia_org
      fiveg-ue-bgp03_sac_bgp_05_berylia_org
  - name: drop-ghost-hosts
    action: deny
    destination-address: bgp_sac
    comment: 'Ghost host catch-all: drops traffic to IPs in bgp_sac not matched by
      any allow term above.  All legitimate hosts should appear in policies/pol/ and
      be covered by explicit allow terms.'
  - name: log-accept-ANY
    action: accept
    logging: true
    comment: 'INITIAL DEPLOYMENT: accept + log all unmatched traffic. Promote to log-drop
      (--terminal log-drop) once rules are stable.'
